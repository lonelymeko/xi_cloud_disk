# --- HTTP (端口 80) 自动重定向到 HTTPS ---
server {
    listen 80;
    server_name lonelymeko.top mail.lonelymeko.top;

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (端口 443) 主站配置 ---
server {
    listen 443 ssl http2;
    server_name lonelymeko.top;

    ssl_certificate /etc/letsencrypt/live/lonelymeko.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lonelymeko.top/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # blog 静态站点
    location /blog {
        alias /usr/hexo/myBlog/public;
        index index.html index.htm;
        try_files $uri $uri/ /blog/index.html;

        location ~* ^/blog/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            add_header Access-Control-Allow-Origin *;
        }
    }

    # cloud_disk 前端入口（无斜杠时跳转）
    location = /cloud_disk {
        return 301 /cloud_disk/;
    }

    # cloud_disk 后端 API 反向代理到 8888
    # 前端请求路径: /cloud_disk/api/...
    location ^~ /cloud_disk/api/ {
        proxy_pass http://127.0.0.1:8888/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # cloud_disk 前端静态资源
    # 部署方式：将 web/dist 整体拷贝到 /home/home/cloud_disk
    # 例如: /home/home/cloud_disk/index.html 和 /home/home/cloud_disk/assets/*
    root /home/home;
    location ^~ /cloud_disk/ {
        try_files $uri $uri/ /cloud_disk/index.html;
    }

    # 原站点首页（保留）
    location / {
        root /home/home;
        try_files $uri $uri/ /index.html;
    }

    # 搜狐 API 代理
    location /sohu-api/ {
        proxy_pass http://pv.sohu.com/;
        proxy_set_header Host pv.sohu.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 高德逆地理编码 API 代理
    location /proxy-regeo/ {
        proxy_pass https://restapi.amap.com/v3/geocode/regeo;
        proxy_set_header Host restapi.amap.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 高德天气 API 代理
    location /proxy-weather/ {
        proxy_pass https://restapi.amap.com/v3/weather/weatherInfo;
        proxy_set_header Host restapi.amap.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 图片资源处理
    location /love/img/ {
        alias /home/home/img/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Bilibili 热搜 API 代理
    location /api/bilibili/ {
        proxy_pass https://api.bilibili.com/x/web-interface/wbi/;
        proxy_set_header Host api.bilibili.com;
        proxy_set_header Referer https://www.bilibili.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        add_header Cache-Control "no-store";
    }

    # 今日头条 API 代理
    location /api/toutiao/ {
        proxy_pass https://dabenshi.cn/other/api/;
        proxy_set_header Host dabenshi.cn;
        proxy_set_header Referer https://www.toutiao.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        add_header Cache-Control "no-store";
    }
}

# --- HTTPS (端口 443) 邮件子域配置 ---
server {
    listen 443 ssl http2;
    server_name mail.lonelymeko.top;

    ssl_certificate /etc/letsencrypt/live/lonelymeko.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lonelymeko.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass https://localhost:8443/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
